<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>每日任务抽奖转盘</title>
<style>
  :root {
    --bg1: #f3f5fb;
    --bg2: #e9edf7;
    --card: #ffffff;
    --ink: #1f2330;
    --muted: #7b8194;
    --accent: #5c6bc0;
    --danger: #e53935;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    color: var(--ink);
    background: linear-gradient(160deg, var(--bg1), var(--bg2));
    min-height: 100vh;
    padding: 24px 16px 48px;
  }
  .wrap { max-width: 460px; margin: 0 auto; }
  h1 {
    font-size: 22px; text-align: center; margin: 4px 0 2px;
    letter-spacing: 1px;
  }
  .sub { text-align: center; color: var(--muted); font-size: 13px; margin-bottom: 18px; }

  .wheelBox {
    position: relative;
    width: 100%;
    max-width: 380px;
    margin: 0 auto;
    aspect-ratio: 1 / 1;
  }
  canvas { width: 100%; height: 100%; display: block; filter: drop-shadow(0 10px 24px rgba(60,70,120,.18)); }

  /* 顶部固定指针 */
  .pointer {
    position: absolute;
    top: -2px; left: 50%;
    transform: translateX(-50%);
    width: 0; height: 0;
    border-left: 14px solid transparent;
    border-right: 14px solid transparent;
    border-top: 26px solid var(--danger);
    filter: drop-shadow(0 3px 3px rgba(0,0,0,.25));
    z-index: 5;
  }

  .controls { text-align: center; margin: 18px 0 8px; }
  .spinBtn {
    appearance: none; border: none; cursor: pointer;
    font-size: 18px; font-weight: 700; color: #fff;
    padding: 14px 38px; border-radius: 999px;
    background: linear-gradient(135deg, #5c6bc0, #7e57c2);
    box-shadow: 0 8px 18px rgba(92,107,192,.45);
    transition: transform .1s ease, opacity .2s ease;
  }
  .spinBtn:active { transform: scale(.96); }
  .spinBtn:disabled { opacity: .5; cursor: not-allowed; }

  .stat { text-align: center; color: var(--muted); font-size: 13px; margin: 6px 0 0; }

  .panel {
    background: var(--card);
    border-radius: 16px;
    padding: 16px 16px 18px;
    margin-top: 22px;
    box-shadow: 0 6px 20px rgba(60,70,120,.10);
  }
  .panel h2 { font-size: 15px; margin: 0 0 12px; display: flex; align-items: center; gap: 6px; }
  .addRow { display: flex; gap: 8px; margin-bottom: 12px; }
  .addRow input {
    flex: 1; padding: 10px 12px; border: 1px solid #dfe3ee; border-radius: 10px;
    font-size: 14px; outline: none;
  }
  .addRow input:focus { border-color: var(--accent); }
  .addRow button {
    border: none; cursor: pointer; color: #fff; background: var(--accent);
    border-radius: 10px; padding: 0 16px; font-weight: 600; font-size: 14px;
  }
  ul.taskList { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
  ul.taskList li { display: flex; gap: 8px; align-items: center; }
  ul.taskList li input {
    flex: 1; padding: 9px 11px; border: 1px solid #e3e7f0; border-radius: 9px; font-size: 14px; outline: none;
  }
  ul.taskList li input:focus { border-color: var(--accent); }
  .delBtn {
    border: none; cursor: pointer; background: #ffebee; color: var(--danger);
    width: 34px; height: 34px; border-radius: 9px; font-size: 15px; font-weight: 700; flex: none;
  }
  .delBtn:hover { background: #ffcdd2; }
  .panelFoot { display: flex; justify-content: space-between; margin-top: 14px; }
  .panelFoot button {
    background: none; border: 1px solid #e1e5ef; color: var(--muted);
    border-radius: 9px; padding: 7px 12px; font-size: 12px; cursor: pointer;
  }
  .panelFoot button:hover { border-color: var(--accent); color: var(--accent); }

  .disabledOverlay { opacity: .45; pointer-events: none; transition: opacity .2s; }

  /* 空转 toast */
  .toast {
    position: fixed; left: 50%; top: 22%; transform: translate(-50%, -10px);
    background: rgba(30,34,48,.92); color: #fff; padding: 10px 18px; border-radius: 999px;
    font-size: 14px; font-weight: 600; opacity: 0; pointer-events: none;
    transition: opacity .25s ease, transform .25s ease; z-index: 30;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }

  /* 警告弹窗 */
  .modal {
    position: fixed; inset: 0; display: none; align-items: center; justify-content: center;
    background: rgba(20,10,10,.55); z-index: 40; padding: 20px;
  }
  .modal.show { display: flex; }
  .modalCard {
    background: linear-gradient(160deg, #ff5252, #d50000);
    color: #fff; border-radius: 20px; padding: 34px 30px; width: 100%; max-width: 340px;
    text-align: center; box-shadow: 0 20px 60px rgba(213,0,0,.45);
  }
  .modalCard.shake { animation: shake .5s ease; }
  @keyframes shake {
    0%,100% { transform: translateX(0); }
    15% { transform: translateX(-12px) rotate(-1deg); }
    30% { transform: translateX(11px) rotate(1deg); }
    45% { transform: translateX(-9px); }
    60% { transform: translateX(8px); }
    75% { transform: translateX(-5px); }
  }
  .modalIcon { font-size: 46px; line-height: 1; margin-bottom: 8px; }
  .modalTitle { font-size: 16px; font-weight: 700; letter-spacing: 2px; opacity: .95; margin-bottom: 14px; }
  .modalText { font-size: 28px; font-weight: 800; margin-bottom: 22px; word-break: break-all; }
  .modalBtn {
    border: none; cursor: pointer; background: #fff; color: #d50000;
    font-weight: 800; font-size: 16px; padding: 12px 26px; border-radius: 999px;
    box-shadow: 0 6px 14px rgba(0,0,0,.2);
  }
  .modalBtn:active { transform: scale(.96); }
</style>
</head>
<body>
<div class="wrap">
  <h1>🎯 每日任务抽奖转盘</h1>
  <div class="sub">治决策瘫痪 · 让命运替你选</div>

  <div class="wheelBox">
    <div class="pointer"></div>
    <canvas id="wheel"></canvas>
  </div>

  <div class="controls">
    <button class="spinBtn" id="spinBtn">开始抽奖</button>
    <p class="stat" id="stat"></p>
  </div>

  <div class="panel">
    <h2>📝 任务池（记忆 + 增删改）</h2>
    <div class="addRow">
      <input id="addInput" type="text" placeholder="输入一个任务，回车添加…" maxlength="40" />
      <button id="addBtn">添加</button>
    </div>
    <ul class="taskList" id="taskList"></ul>
    <div class="panelFoot">
      <button id="clearBtn">清空全部</button>
      <button id="sampleBtn">恢复示例</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<div class="modal" id="modal">
  <div class="modalCard" id="modalCard">
    <div class="modalIcon">⚠️</div>
    <div class="modalTitle">警 告</div>
    <div class="modalText" id="modalText">滚去 干活</div>
    <button class="modalBtn" id="modalBtn">收到，这就滚</button>
  </div>
</div>

<script>
(function () {
  "use strict";

  const STORAGE_KEY = "taskWheel.v1";
  const SAMPLE = ["写今日周报", "健身 30 分钟", "回重要邮件", "读书 10 页", "整理桌面"];

  // 调色板：饱和、互相区分、绝不含白色
  const PALETTE = [
    "#ef5350", "#ab47bc", "#5c6bc0", "#29b6f6", "#26a69a",
    "#9ccc65", "#ffa726", "#ff7043", "#8d6e63", "#78909c",
    "#ec407a", "#7e57c2", "#26c6da", "#d4e157", "#ff8a65"
  ];

  const canvas = document.getElementById("wheel");
  const ctx = canvas.getContext("2d");
  const spinBtn = document.getElementById("spinBtn");
  const statEl = document.getElementById("stat");
  const taskListEl = document.getElementById("taskList");
  const addInput = document.getElementById("addInput");
  const addBtn = document.getElementById("addBtn");
  const clearBtn = document.getElementById("clearBtn");
  const sampleBtn = document.getElementById("sampleBtn");
  const toastEl = document.getElementById("toast");
  const modal = document.getElementById("modal");
  const modalCard = document.getElementById("modalCard");
  const modalText = document.getElementById("modalText");
  const modalBtn = document.getElementById("modalBtn");

  let tasks = [];
  let segments = [];          // {type,label,frac,color,_center}
  let currentRotation = 0;    // 弧度
  let spinning = false;
  let lastResult = "";
  let W = 0, H = 0, cx = 0, cy = 0, r = 0;

  /* ---------- 持久化 ---------- */
  function load() {
    try {
      const d = JSON.parse(localStorage.getItem(STORAGE_KEY));
      if (d && Array.isArray(d.tasks)) tasks = d.tasks.filter(t => typeof t === "string");
      if (typeof d.last === "string") lastResult = d.last;
    } catch (e) { /* ignore */ }
    if (tasks.length === 0) tasks = SAMPLE.slice();
    save();
  }
  function save() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({ tasks: tasks, last: lastResult }));
    } catch (e) { /* ignore */ }
  }

  /* ---------- 算法：扇区构建 ----------
     kn = n × ⌊100/n⌋，每个任务扇区相等 = (kn/n)% = ⌊100/n⌋%
     空白占比 = 100 mod n（n 能整除 100 时为 0）
  */
  function colorFor(i, n) {
    if (i < PALETTE.length) return PALETTE[i];
    const hue = Math.round((i * 360) / Math.max(n, 1));
    return "hsl(" + hue + ", 62%, 52%)";
  }

  function buildSegments() {
    segments = [];
    const n = tasks.length;
    if (n === 0) return;
    const k = Math.floor(100 / n);     // 每个任务占比(%)
    const white = 100 - n * k;         // 空白占比(%)
    let base = 0;
    for (let i = 0; i < n; i++) {
      const frac = k / 100;
      const a0 = base, a1 = base + frac * 2 * Math.PI;
      segments.push({
        type: "task", label: tasks[i], frac: frac,
        color: colorFor(i, n), _center: (a0 + a1) / 2
      });
      base = a1;
    }
    if (white > 0) {
      const frac = white / 100;
      const a0 = base, a1 = base + frac * 2 * Math.PI;
      segments.push({ type: "blank", label: "", frac: frac, color: "#ffffff", _center: (a0 + a1) / 2 });
    }
  }

  /* ---------- 画布 ---------- */
  function setupCanvas() {
    const rect = canvas.getBoundingClientRect();
    const size = Math.max(200, Math.min(380, rect.width || 380));
    const dpr = window.devicePixelRatio || 1;
    canvas.width = size * dpr;
    canvas.height = size * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    W = size; H = size; cx = size / 2; cy = size / 2; r = size / 2 - 6;
  }

  function drawLabel(text, angle) {
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(angle);
    const flip = Math.cos(angle) < 0;
    if (flip) ctx.rotate(Math.PI);
    const dist = r - 16;
    ctx.textBaseline = "middle";
    ctx.font = "bold 14px system-ui, sans-serif";
    let t = text.length > 9 ? text.slice(0, 8) + "…" : text;
    ctx.lineWidth = 3;
    ctx.strokeStyle = "rgba(0,0,0,0.35)";
    ctx.fillStyle = "#fff";
    if (flip) { ctx.textAlign = "left"; ctx.strokeText(t, -dist, 0); ctx.fillText(t, -dist, 0); }
    else { ctx.textAlign = "right"; ctx.strokeText(t, dist, 0); ctx.fillText(t, dist, 0); }
    ctx.restore();
  }

  function drawWheel(rotation) {
    ctx.clearRect(0, 0, W, H);
    let base = 0;
    for (const s of segments) {
      const a0 = base;
      const a1 = base + s.frac * 2 * Math.PI;
      const cs0 = -Math.PI / 2 + a0 + rotation;
      const cs1 = -Math.PI / 2 + a1 + rotation;
      ctx.beginPath();
      ctx.moveTo(cx, cy);
      ctx.arc(cx, cy, r, cs0, cs1);
      ctx.closePath();
      ctx.fillStyle = s.color;
      ctx.fill();
      ctx.strokeStyle = "rgba(0,0,0,0.12)";
      ctx.lineWidth = 1;
      ctx.stroke();
      if (s.type === "task") {
        drawLabel(s.label, -Math.PI / 2 + (a0 + a1) / 2 + rotation);
      }
      base = a1;
    }
    // 中心轴
    ctx.beginPath();
    ctx.arc(cx, cy, 14, 0, 2 * Math.PI);
    ctx.fillStyle = "#fff";
    ctx.fill();
    ctx.strokeStyle = "rgba(0,0,0,0.15)";
    ctx.lineWidth = 2;
    ctx.stroke();
  }

  /* ---------- 抽奖 ---------- */
  function pickIndex() {
    const x = Math.random();
    let acc = 0;
    for (let i = 0; i < segments.length; i++) {
      acc += segments[i].frac;
      if (x < acc) return i;
    }
    return segments.length - 1;
  }

  function doOneSpin() {
    const idx = pickIndex();
    const seg = segments[idx];
    const currentScreenCenter = seg._center + currentRotation;
    const cur = ((currentScreenCenter % (2 * Math.PI)) + 2 * Math.PI) % (2 * Math.PI);
    const delta = (2 * Math.PI - cur) % (2 * Math.PI);   // 让该扇区中心转到指针(正上方)
    const spins = 2 * Math.PI * (5 + Math.floor(Math.random() * 3));
    const startRot = currentRotation;
    const endRot = currentRotation + spins + delta;
    const dur = 3600 + Math.random() * 1400;
    const t0 = performance.now();

    function frame(now) {
      const p = Math.min(1, (now - t0) / dur);
      const e = 1 - Math.pow(1 - p, 3); // easeOutCubic
      currentRotation = startRot + (endRot - startRot) * e;
      drawWheel(currentRotation);
      if (p < 1) {
        requestAnimationFrame(frame);
      } else {
        if (seg.type === "blank") {
          showToast("空转一下，再抽！");
          setTimeout(doOneSpin, 750);
        } else {
          spinning = false;
          setSpinEnabled(true);
          showWarning(seg.label);
        }
      }
    }
    requestAnimationFrame(frame);
  }

  function spin() {
    if (spinning || tasks.length === 0) return;
    spinning = true;
    setSpinEnabled(false);
    doOneSpin();
  }

  /* ---------- 反馈：警告弹窗 / 空转 toast ---------- */
  function showWarning(name) {
    lastResult = name;
    save();
    modalText.textContent = "滚去 " + name;
    modal.classList.add("show");
    modalCard.classList.remove("shake");
    void modalCard.offsetWidth; // 重启动画
    modalCard.classList.add("shake");
    if (navigator.vibrate) {
      try { navigator.vibrate([200, 80, 200, 80, 320]); } catch (e) {}
    }
  }
  function showToast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add("show");
    clearTimeout(showToast._t);
    showToast._t = setTimeout(() => toastEl.classList.remove("show"), 900);
  }

  /* ---------- 任务列表 CRUD ---------- */
  function renderTaskList() {
    taskListEl.innerHTML = "";
    tasks.forEach((t, i) => {
      const li = document.createElement("li");
      const inp = document.createElement("input");
      inp.type = "text";
      inp.value = t;
      inp.maxLength = 40;
      inp.addEventListener("input", () => {
        if (spinning) return;
        tasks[i] = inp.value;
        save();
        buildSegments();
        drawWheel(currentRotation);
        updateStat();
      });
      const del = document.createElement("button");
      del.className = "delBtn";
      del.textContent = "✕";
      del.title = "删除";
      del.addEventListener("click", () => {
        if (spinning) return;
        tasks.splice(i, 1);
        save();
        buildSegments();
        drawWheel(currentRotation);
        renderTaskList();
        updateStat();
        setSpinEnabled(tasks.length > 0);
      });
      li.appendChild(inp);
      li.appendChild(del);
      taskListEl.appendChild(li);
    });
  }

  function addTask() {
    const v = addInput.value.trim();
    if (!v) return;
    tasks.push(v);
    addInput.value = "";
    save();
    buildSegments();
    drawWheel(currentRotation);
    renderTaskList();
    updateStat();
    setSpinEnabled(true);
  }

  function updateStat() {
    const n = tasks.length;
    if (n === 0) {
      statEl.textContent = "任务池为空，请先添加任务";
      return;
    }
    const white = 100 - n * Math.floor(100 / n);
    const parts = ["共 " + n + " 个任务"];
    if (white > 0) parts.push("空白区 " + white + "%（空转概率）");
    else parts.push("无空白区");
    if (lastResult) parts.push("上次：滚去 " + lastResult);
    statEl.textContent = parts.join(" · ");
  }

  function setSpinEnabled(ok) {
    spinBtn.disabled = !ok || spinning;
  }

  /* ---------- 事件 ---------- */
  spinBtn.addEventListener("click", spin);
  addBtn.addEventListener("click", addTask);
  addInput.addEventListener("keydown", (e) => { if (e.key === "Enter") addTask(); });
  clearBtn.addEventListener("click", () => {
    if (spinning) return;
    if (!confirm("确定清空所有任务？")) return;
    tasks = [];
    save();
    buildSegments();
    drawWheel(currentRotation);
    renderTaskList();
    updateStat();
    setSpinEnabled(false);
  });
  sampleBtn.addEventListener("click", () => {
    if (spinning) return;
    tasks = SAMPLE.slice();
    save();
    buildSegments();
    drawWheel(currentRotation);
    renderTaskList();
    updateStat();
    setSpinEnabled(true);
  });
  modalBtn.addEventListener("click", () => modal.classList.remove("show"));
  modal.addEventListener("click", (e) => { if (e.target === modal) modal.classList.remove("show"); });

  let resizeT = null;
  window.addEventListener("resize", () => {
    clearTimeout(resizeT);
    resizeT = setTimeout(() => { setupCanvas(); drawWheel(currentRotation); }, 120);
  });

  /* ---------- 启动 ---------- */
  load();
  setupCanvas();
  buildSegments();
  drawWheel(currentRotation);
  renderTaskList();
  updateStat();
  setSpinEnabled(tasks.length > 0);
})();
</script>
</body>
</html>
